<div class="page d-flex">
    <div>
        <app-sidebar></app-sidebar>
    </div>
    <div class="section w-100 overflow-y-scroll">
        <div class="d-flex justify-content-between px-3 pt-3 ">
            <div class="col-3">
                <h2 class="fw-bold">City</h2>
            </div>
            <div class="col-3 d-flex justify-content-end">
                <input type="text" class="search-input me-2 ps-3" placeholder="search">
                <button class="btn-dark-blue text-white px-2 fs-3"><i class="bi bi-filter"></i></button>
            </div>
        </div>
        <div class="px-3 mt-3 ">
            <table class="w-100 ">
                <tbody class="d-flex justify-content-between flex-column">
                    <tr class="page-table-row d-flex justify-content-between align-items-center px-4">
                        <th scope="col" class="text-muted">ID</th>
                        <th scope="col" class="text-muted">NAME</th>
                        <button class="btn btn-white" type="button" id="dropdownMenu2" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-three-dots"></i>
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="dropdownMenu2">
                            <li><button class="dropdown-item" type="button">Delete All</button></li>
                            <li><button class="dropdown-item" type="button">Add product</button></li>
                        </ul>
                    </tr>
                    <tr class="page-table-row d-flex justify-content-between align-items-center px-4">
                        <td>1</td>
                        <td>Mashhad</td>
                        <!-- <td class="item-menu"><i class="bi bi-three-dots"></i></td> -->
                        <button class="btn btn-white" type="button" id="dropdownMenu2" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-three-dots"></i>
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="dropdownMenu2">
                            <li><button class="dropdown-item" type="button">Delete</button></li>
                        </ul>
                    </tr>
                </tbody>
            </table>
        </div>
        <button (click)="toggleVisibility()"
        class="btn add-btn rounded-circle position-fixed bottom-0 end-0 m-3 me-4 text-white d-flex justify-content-center align-items-center"><i
        class="bi bi-plus-lg text-white fs-4"></i></button>
    </div>
</div>
<app-add-city *ngIf="isclosed" class="position-fixed top-0 w-100"></app-add-city>
